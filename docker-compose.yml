services:
  postgres:
    image: postgres:16-alpine
    container_name: medizinhub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medizinhub_hms}
      POSTGRES_USER: ${POSTGRES_USER:-medizinhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medizinhub_dev}
    ports:
      - "5433:5432"
    volumes:
      - medizinhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medizinhub -d medizinhub_hms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medizinhub-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-false}
    container_name: medizinhub-frontend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-false}

  backend:
    build: ./backend
    container_name: medizinhub-backend
    ports:
      - "8080:8080"
    extra_hosts:
      - "local.healthcare:host-gateway"
    depends_on:
      - postgres
      - redis
    env_file:
    - .env
    command: >
      bash -c "
      alembic -c alembic/alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8080
      "
    environment:
      PYTHONPATH: /app
      MEDIZINHUB_REDIS_URL: redis://redis:6379/0

  report-worker:
    build: ./backend
    container_name: medizinhub-report-worker
    extra_hosts:
      - "local.healthcare:host-gateway"
    depends_on:
      - postgres
      - redis
    env_file:
    - .env
    command: python -m app.modules.reports.worker
    environment:
      PYTHONPATH: /app
      MEDIZINHUB_REDIS_URL: redis://redis:6379/0

volumes:
  medizinhub_postgres_data:
