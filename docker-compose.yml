name: medizinhub-hms

services:
  postgres:
    image: postgres:16-alpine
    container_name: medizinhub-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - medizinhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: medizinhub-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    # Sits between the app processes and Postgres so the number of real
    # Postgres connections is bounded by DEFAULT_POOL_SIZE regardless of how
    # many backend/report-worker processes exist — each process's own
    # SQLAlchemy pool (MEDIZINHUB_DB_POOL_SIZE/MAX_OVERFLOW) only bounds its
    # client connections to pgbouncer, not to Postgres itself. This is what
    # actually prevents `QueuePool ... TimeoutError` under concurrent load,
    # rather than just raising the app-side pool numbers.
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: medizinhub-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      # How long a client may wait for a server connection before the query is
      # cancelled. PgBouncer's default is 120s, and leaving it there quietly
      # disables the application's load shedding: a SQLAlchemy checkout only
      # acquires a *client* connection to PgBouncer, which is not the scarce
      # resource, so MEDIZINHUB_DB_POOL_TIMEOUT never fires and the real wait
      # happens here instead. Saturation then surfaces as a two-minute hang
      # rather than 503 + Retry-After, and `database_pool_timeouts` stays at
      # zero while the system is failing. Note statement_timeout does not cover
      # this — it only starts once a statement is executing on the server.
      QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-10}
      # A client still waiting after RESERVE_POOL_TIMEOUT may use the reserve
      # connections, so a brief burst borrows capacity instead of queueing for
      # the full wait. Total server connections per pool are therefore
      # DEFAULT_POOL_SIZE + RESERVE_POOL_SIZE; keep that under Postgres
      # max_connections with room for migrations, backups and administrators.
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}
      # Grants this user the PgBouncer admin console (the virtual "pgbouncer"
      # database), which is how SHOW CONFIG, SHOW POOLS and SHOW STATS are
      # reached. SHOW POOLS' cl_waiting and maxwait are the only direct
      # measurement of contention for the server pool above — without them,
      # saturation can only be inferred from the application side. The console
      # is not exposed to the host: this service publishes no ports and is
      # reachable only on the compose network.
      ADMIN_USERS: ${POSTGRES_USER:?POSTGRES_USER is required}
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image listens on the standard PostgreSQL port (5432). Run a real
      # authenticated query through PgBouncer so a listening but unusable
      # pooler cannot make the application appear deployment-ready.
      test: ["CMD-SHELL", "PGPASSWORD=\"$${DB_PASSWORD}\" psql -h 127.0.0.1 -p 5432 -U \"$${DB_USER}\" -d \"$${DB_NAME}\" -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
        APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
        BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    container_name: medizinhub-frontend
    ports:
      - "${MEDIZINHUB_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
        BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    container_name: medizinhub-backend
    ports:
      - "${MEDIZINHUB_API_PORT:-8080}:8080"
    extra_hosts:
      - "local.healthcare:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - medizinhub_uploads_data:/app/uploads
    command: python scripts/start_api.py
    environment:
      PYTHONPATH: /app
      # Routed through pgbouncer (not directly at postgres:5432) so the
      # number of real Postgres connections stays bounded no matter how many
      # workers/processes run — see the pgbouncer service comment above.
      # start_api.py uses the direct migration URL only while holding a
      # PostgreSQL advisory lock. Normal API traffic always uses PgBouncer.
      # Built here from parts rather than read from the env file, so exactly
      # one place defines it and no .env can silently contradict the topology
      # this file provides. Only the host varies between environments:
      # MEDIZINHUB_DB_HOST defaults to the pooler because that is the whole
      # point of this stack. Set it to `postgres` to bypass PgBouncer.
      MEDIZINHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${MEDIZINHUB_DB_HOST:-pgbouncer}:${MEDIZINHUB_DB_PORT:-5432}/${POSTGRES_DB:?POSTGRES_DB is required}
      # Migrations must reach PostgreSQL directly: they hold a session-level
      # advisory lock, which a transaction pooler cannot keep across
      # statements. This deliberately does not point at the pooler.
      MEDIZINHUB_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${MEDIZINHUB_MIGRATION_DB_HOST:-postgres}:${MEDIZINHUB_MIGRATION_DB_PORT:-5432}/${POSTGRES_DB:?POSTGRES_DB is required}
      MEDIZINHUB_DB_POOL_SIZE: ${MEDIZINHUB_DB_POOL_SIZE:-10}
      MEDIZINHUB_DB_MAX_OVERFLOW: ${MEDIZINHUB_DB_MAX_OVERFLOW:-10}
      # Two waits exist under PgBouncer and both must be bounded. This one
      # covers contention for *this process's* client connections and raises
      # SQLAlchemy TimeoutError, which main.py maps to 503 + Retry-After.
      # PGBOUNCER_QUERY_WAIT_TIMEOUT covers contention for the shared server
      # pool. Keep this the shorter of the two so app-side saturation is
      # reported by the application rather than surfacing as a driver error.
      MEDIZINHUB_DB_POOL_TIMEOUT: ${MEDIZINHUB_DB_POOL_TIMEOUT:-5}
      MEDIZINHUB_DB_STATEMENT_TIMEOUT_MS: ${MEDIZINHUB_DB_STATEMENT_TIMEOUT_MS:-30000}
      MEDIZINHUB_DB_LOCK_TIMEOUT_MS: ${MEDIZINHUB_DB_LOCK_TIMEOUT_MS:-5000}
      MEDIZINHUB_DB_IDLE_TRANSACTION_TIMEOUT_MS: ${MEDIZINHUB_DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
      # Required whenever MEDIZINHUB_DB_HOST is a transaction-mode pooler:
      # named prepared statements do not survive server reassignment.
      MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS: ${MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS:-true}
      MEDIZINHUB_REDIS_URL: redis://${MEDIZINHUB_REDIS_HOST:-redis}:${MEDIZINHUB_REDIS_PORT:-6379}/${MEDIZINHUB_REDIS_DB:-0}
      MEDIZINHUB_WEB_CONCURRENCY: ${MEDIZINHUB_WEB_CONCURRENCY:-2}
      MEDIZINHUB_WEB_LIMIT_CONCURRENCY: ${MEDIZINHUB_WEB_LIMIT_CONCURRENCY:-80}
      MEDIZINHUB_WEB_THREAD_LIMIT: ${MEDIZINHUB_WEB_THREAD_LIMIT:-40}
      MEDIZINHUB_APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
      MEDIZINHUB_BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
      MEDIZINHUB_BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    stop_grace_period: ${MEDIZINHUB_STOP_GRACE_PERIOD:-45s}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  report-worker:
    build:
      context: ./backend
      args:
        APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
        BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    container_name: medizinhub-report-worker
    extra_hosts:
      - "local.healthcare:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - medizinhub_uploads_data:/app/uploads
    command: python -m app.modules.reports.worker
    environment:
      PYTHONPATH: /app
      # Same reasoning as the backend service: go through pgbouncer so this
      # long-lived process's pool doesn't add its own uncoordinated slice of
      # direct Postgres connections.
      MEDIZINHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@${MEDIZINHUB_DB_HOST:-pgbouncer}:${MEDIZINHUB_DB_PORT:-5432}/${POSTGRES_DB:?POSTGRES_DB is required}
      # Deliberately smaller than the API's budget: a report run must never
      # consume the connections serving patients.
      MEDIZINHUB_DB_POOL_SIZE: ${MEDIZINHUB_WORKER_DB_POOL_SIZE:-5}
      MEDIZINHUB_DB_MAX_OVERFLOW: ${MEDIZINHUB_WORKER_DB_MAX_OVERFLOW:-5}
      MEDIZINHUB_DB_POOL_TIMEOUT: ${MEDIZINHUB_DB_POOL_TIMEOUT:-5}
      MEDIZINHUB_DB_STATEMENT_TIMEOUT_MS: ${MEDIZINHUB_DB_STATEMENT_TIMEOUT_MS:-30000}
      MEDIZINHUB_DB_LOCK_TIMEOUT_MS: ${MEDIZINHUB_DB_LOCK_TIMEOUT_MS:-5000}
      MEDIZINHUB_DB_IDLE_TRANSACTION_TIMEOUT_MS: ${MEDIZINHUB_DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
      MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS: ${MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS:-true}
      MEDIZINHUB_REDIS_URL: redis://${MEDIZINHUB_REDIS_HOST:-redis}:${MEDIZINHUB_REDIS_PORT:-6379}/${MEDIZINHUB_REDIS_DB:-0}
      MEDIZINHUB_APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
      MEDIZINHUB_BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
      MEDIZINHUB_BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    stop_grace_period: ${MEDIZINHUB_STOP_GRACE_PERIOD:-45s}
    restart: unless-stopped

volumes:
  medizinhub_postgres_data:
  medizinhub_uploads_data:
