services:
  postgres:
    image: postgres:16-alpine
    container_name: medizinhub-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medizinhub_hms}
      POSTGRES_USER: ${POSTGRES_USER:-medizinhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medizinhub_dev}
    volumes:
      - medizinhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medizinhub} -d ${POSTGRES_DB:-medizinhub_hms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: medizinhub-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    # Sits between the app processes and Postgres so the number of real
    # Postgres connections is bounded by DEFAULT_POOL_SIZE regardless of how
    # many backend/report-worker processes exist — each process's own
    # SQLAlchemy pool (MEDIZINHUB_DB_POOL_SIZE/MAX_OVERFLOW) only bounds its
    # client connections to pgbouncer, not to Postgres itself. This is what
    # actually prevents `QueuePool ... TimeoutError` under concurrent load,
    # rather than just raising the app-side pool numbers.
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: medizinhub-pgbouncer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medizinhub}:${POSTGRES_PASSWORD:-medizinhub_dev}@postgres:5432/${POSTGRES_DB:-medizinhub_hms}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    # No container-native healthcheck here: the image doesn't reliably bundle
    # a client that can probe the pgbouncer port from inside the container.
    # `backend`/`report-worker` depend on it with the default service_started
    # condition and will simply fail their own DB calls (and their health
    # endpoint) if pgbouncer isn't actually accepting connections yet.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-false}
        APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
        BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    container_name: medizinhub-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
        BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    container_name: medizinhub-backend
    ports:
      - "8080:8080"
    extra_hosts:
      - "local.healthcare:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - medizinhub_uploads_data:/app/uploads
    command: python scripts/start_api.py
    environment:
      PYTHONPATH: /app
      # Routed through pgbouncer (not directly at postgres:5432) so the
      # number of real Postgres connections stays bounded no matter how many
      # workers/processes run — see the pgbouncer service comment above.
      # start_api.py uses the direct migration URL only while holding a
      # PostgreSQL advisory lock. Normal API traffic always uses PgBouncer.
      MEDIZINHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medizinhub}:${POSTGRES_PASSWORD:-medizinhub_dev}@pgbouncer:6432/${POSTGRES_DB:-medizinhub_hms}
      MEDIZINHUB_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medizinhub}:${POSTGRES_PASSWORD:-medizinhub_dev}@postgres:5432/${POSTGRES_DB:-medizinhub_hms}
      MEDIZINHUB_DB_POOL_SIZE: "10"
      MEDIZINHUB_DB_MAX_OVERFLOW: "10"
      MEDIZINHUB_DB_POOL_TIMEOUT: "5"
      MEDIZINHUB_DB_STATEMENT_TIMEOUT_MS: "30000"
      MEDIZINHUB_DB_LOCK_TIMEOUT_MS: "5000"
      MEDIZINHUB_DB_IDLE_TRANSACTION_TIMEOUT_MS: "60000"
      MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS: "true"
      MEDIZINHUB_REDIS_URL: redis://redis:6379/0
      MEDIZINHUB_APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
      MEDIZINHUB_BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
      MEDIZINHUB_BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  report-worker:
    build:
      context: ./backend
      args:
        APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
        BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    container_name: medizinhub-report-worker
    extra_hosts:
      - "local.healthcare:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    env_file:
      - .env
    volumes:
      - medizinhub_uploads_data:/app/uploads
    command: python -m app.modules.reports.worker
    environment:
      PYTHONPATH: /app
      # Same reasoning as the backend service: go through pgbouncer so this
      # long-lived process's pool doesn't add its own uncoordinated slice of
      # direct Postgres connections.
      MEDIZINHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medizinhub}:${POSTGRES_PASSWORD:-medizinhub_dev}@pgbouncer:6432/${POSTGRES_DB:-medizinhub_hms}
      MEDIZINHUB_DB_POOL_SIZE: "5"
      MEDIZINHUB_DB_MAX_OVERFLOW: "5"
      MEDIZINHUB_DB_POOL_TIMEOUT: "5"
      MEDIZINHUB_DB_STATEMENT_TIMEOUT_MS: "30000"
      MEDIZINHUB_DB_LOCK_TIMEOUT_MS: "5000"
      MEDIZINHUB_DB_IDLE_TRANSACTION_TIMEOUT_MS: "60000"
      MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS: "true"
      MEDIZINHUB_REDIS_URL: redis://redis:6379/0
      MEDIZINHUB_APP_VERSION: ${MEDIZINHUB_APP_VERSION:-0.1.0}
      MEDIZINHUB_BUILD_COMMIT: ${MEDIZINHUB_BUILD_COMMIT:-unknown}
      MEDIZINHUB_BUILD_TIME: ${MEDIZINHUB_BUILD_TIME:-}
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  medizinhub_postgres_data:
  medizinhub_uploads_data:
