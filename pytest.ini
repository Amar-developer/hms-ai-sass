[pytest]
pythonpath = backend
testpaths = backend/tests
markers =
    e2e: live backend end-to-end tests requiring PostgreSQL and Uvicorn
    unit: isolated business rules, calculations, validation, permission decisions, and pure transformations
    integration: repository, database, storage, queue, or service collaboration tests
    api: FastAPI/TestClient HTTP contract, auth, permission, and route behavior tests
    slow: larger workflow suites that are reserved for full CI or intentional local runs
