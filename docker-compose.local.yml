name: ${MEDIZINHUB_PROJECT_NAME:-medizinhub-hms-local}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${MEDIZINHUB_PROJECT_NAME:-medizinhub-hms-local}-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medizinhub_hms}
      POSTGRES_USER: ${POSTGRES_USER:-medizinhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medizinhub_dev}
    ports:
      - "${MEDIZINHUB_POSTGRES_PORT:-5433}:5432"
    volumes:
      - medizinhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medizinhub} -d ${POSTGRES_DB:-medizinhub_hms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${MEDIZINHUB_PROJECT_NAME:-medizinhub-hms-local}-redis
    ports:
      - "${MEDIZINHUB_REDIS_PORT_HOST:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
    container_name: ${MEDIZINHUB_PROJECT_NAME:-medizinhub-hms-local}-frontend
    ports:
      - "${MEDIZINHUB_FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # The anonymous node_modules volume above can go stale after a rebuild
    # (Compose reuses the old volume's contents instead of the freshly built
    # image's node_modules). Installing here reconciles node_modules against
    # the mounted package.json on every start, so newly added dependencies
    # are always present without needing a manual `docker compose up -V`.
    command: sh -c "npm install && npm run dev"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
      MEDIZINHUB_INTERNAL_API_URL: http://backend:8080/api/v1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ${MEDIZINHUB_PROJECT_NAME:-medizinhub-hms-local}-backend
    ports:
      - "${MEDIZINHUB_API_PORT:-8080}:8080"
    extra_hosts:
      - "local.healthcare:host-gateway"
    volumes:
      - ./backend:/app
      - ./VERSION:/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      # Defined here, not in .env, so one place decides where the app connects
      # — the same rule as docker-compose.yml. This stack runs no pooler, so
      # the default host is PostgreSQL itself; docker-compose.yml defaults to
      # pgbouncer instead. Both accept MEDIZINHUB_DB_HOST to override.
      MEDIZINHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medizinhub}:${POSTGRES_PASSWORD:-medizinhub_dev}@${MEDIZINHUB_DB_HOST:-postgres}:${MEDIZINHUB_DB_PORT:-5432}/${POSTGRES_DB:-medizinhub_hms}
      MEDIZINHUB_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medizinhub}:${POSTGRES_PASSWORD:-medizinhub_dev}@${MEDIZINHUB_MIGRATION_DB_HOST:-postgres}:${MEDIZINHUB_MIGRATION_DB_PORT:-5432}/${POSTGRES_DB:-medizinhub_hms}
      # No pooler in this stack, so prepared statements are safe to keep.
      MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS: ${MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS:-false}
      MEDIZINHUB_REDIS_URL: redis://${MEDIZINHUB_REDIS_HOST:-redis}:${MEDIZINHUB_REDIS_PORT:-6379}/${MEDIZINHUB_REDIS_DB:-0}
    command: >
      bash -c "
      alembic -c alembic/alembic.ini upgrade head &&
      python scripts/verify_runtime_readiness.py --ensure-pg-stat-statements &&
      uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  report-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ${MEDIZINHUB_PROJECT_NAME:-medizinhub-hms-local}-report-worker
    extra_hosts:
      - "local.healthcare:host-gateway"
    volumes:
      - ./backend:/app
      - ./VERSION:/VERSION:ro
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      # Defined here, not in .env, so one place decides where the app connects
      # — the same rule as docker-compose.yml. This stack runs no pooler, so
      # the default host is PostgreSQL itself; docker-compose.yml defaults to
      # pgbouncer instead. Both accept MEDIZINHUB_DB_HOST to override.
      MEDIZINHUB_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medizinhub}:${POSTGRES_PASSWORD:-medizinhub_dev}@${MEDIZINHUB_DB_HOST:-postgres}:${MEDIZINHUB_DB_PORT:-5432}/${POSTGRES_DB:-medizinhub_hms}
      MEDIZINHUB_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medizinhub}:${POSTGRES_PASSWORD:-medizinhub_dev}@${MEDIZINHUB_MIGRATION_DB_HOST:-postgres}:${MEDIZINHUB_MIGRATION_DB_PORT:-5432}/${POSTGRES_DB:-medizinhub_hms}
      # No pooler in this stack, so prepared statements are safe to keep.
      MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS: ${MEDIZINHUB_DB_DISABLE_PREPARED_STATEMENTS:-false}
      MEDIZINHUB_REDIS_URL: redis://${MEDIZINHUB_REDIS_HOST:-redis}:${MEDIZINHUB_REDIS_PORT:-6379}/${MEDIZINHUB_REDIS_DB:-0}
    command: python -m app.modules.reports.worker

volumes:
  medizinhub_postgres_data:
