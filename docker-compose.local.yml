services:
  postgres:
    image: postgres:16-alpine
    container_name: medizinhub-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medizinhub_hms}
      POSTGRES_USER: ${POSTGRES_USER:-medizinhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medizinhub_dev}
    ports:
      - "5433:5432"
    volumes:
      - medizinhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medizinhub} -d ${POSTGRES_DB:-medizinhub_hms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medizinhub-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-true}
    container_name: medizinhub-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # The anonymous node_modules volume above can go stale after a rebuild
    # (Compose reuses the old volume's contents instead of the freshly built
    # image's node_modules). Installing here reconciles node_modules against
    # the mounted package.json on every start, so newly added dependencies
    # are always present without needing a manual `docker compose up -V`.
    command: sh -c "npm install && npm run dev"
    depends_on:
      - postgres
      - redis
    environment:
      NEXT_PUBLIC_MEDIZINHUB_API_URL: ${NEXT_PUBLIC_MEDIZINHUB_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-true}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: medizinhub-backend
    ports:
      - "8080:8080"
    extra_hosts:
      - "local.healthcare:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      MEDIZINHUB_REDIS_URL: redis://redis:6379/0
    command: >
      bash -c "
      alembic -c alembic/alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
      "

  report-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: medizinhub-report-worker
    extra_hosts:
      - "local.healthcare:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      MEDIZINHUB_REDIS_URL: redis://redis:6379/0
    command: python -m app.modules.reports.worker

volumes:
  medizinhub_postgres_data:
