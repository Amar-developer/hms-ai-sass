AWSTemplateFormatVersion: "2010-09-09"
Description: Private, encrypted MedizinHub document storage and least-privilege application policy.

Parameters:
  Environment:
    Type: String
    AllowedValues: [local, development, staging, production]
  BucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
  KmsKeyArn:
    Type: String
    Default: ""
    Description: Optional existing KMS key ARN. Empty uses S3-managed encryption.
  TemporaryObjectRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  UsesKms: !Not [!Equals [!Ref KmsKeyArn, ""]]

Resources:
  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: !If [UsesKms, true, false]
            ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [UsesKms, aws:kms, AES256]
              KMSMasterKeyID: !If [UsesKms, !Ref KmsKeyArn, !Ref AWS::NoValue]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: !If [IsProduction, Enabled, Suspended]
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: DeleteExplicitTemporaryObjects
            Status: Enabled
            TagFilters:
              - Key: retention
                Value: temporary
            ExpirationInDays: !Ref TemporaryObjectRetentionDays
          - !If
            - IsProduction
            - Id: TransitionNoncurrentVersions
              Status: Enabled
              NoncurrentVersionTransitions:
                - StorageClass: STANDARD_IA
                  TransitionInDays: 90
            - !Ref AWS::NoValue
      Tags:
        - Key: application
          Value: medizinhub-hms
        - Key: environment
          Value: !Ref Environment
        - Key: data-classification
          Value: sensitive-health-data

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DocumentBucket.Arn
              - !Sub "${DocumentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  DocumentStorageApplicationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub "MedizinHub ${Environment} document storage access"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BucketMetadata
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetBucketPublicAccessBlock
              - s3:ListBucket
            Resource: !GetAtt DocumentBucket.Arn
          - Sid: DocumentObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetObjectTagging
              - s3:PutObjectTagging
            Resource: !Sub "${DocumentBucket.Arn}/*"
          - !If
            - UsesKms
            - Sid: DocumentKmsKey
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey
              Resource: !Ref KmsKeyArn
            - !Ref AWS::NoValue

Outputs:
  BucketName:
    Value: !Ref DocumentBucket
  BucketArn:
    Value: !GetAtt DocumentBucket.Arn
  ApplicationManagedPolicyArn:
    Value: !Ref DocumentStorageApplicationPolicy
  VersioningEnabled:
    Value: !If [IsProduction, "true", "false"]
