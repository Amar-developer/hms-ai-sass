# Single source of truth for Git hooks. Install with: npm run hooks:install
# Installs pre-commit, commit-msg and pre-push hook types in one go.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
        exclude: ^backend/scripts/seed_  # exclude seed scripts
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      # Block direct commits to protected branches
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master
          - --branch=develop
          - --branch=development
          - --branch=production
          - --branch=release

  # Enforce Conventional Commit messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Full quality gate before pushing a feature branch
  - repo: local
    hooks:
      - id: backend-quality
        name: Backend quality gate (ruff + pytest)
        entry: bash -c 'backend/.venv/bin/ruff check backend/app backend/tests && backend/.venv/bin/pytest backend/tests -q'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: frontend-quality
        name: Frontend quality gate (test + typecheck + build)
        entry: bash -c 'npm test && npm run typecheck && npm run build'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
