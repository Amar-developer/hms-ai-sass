name: Frontend E2E Cross Browser

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run extended scenarios in all browsers
        required: false
        default: false
        type: boolean

jobs:
  cross-browser:
    name: Playwright Cross Browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medizinhub_frontend_e2e
          POSTGRES_USER: medizinhub
          POSTGRES_PASSWORD: medizinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medizinhub -d medizinhub_frontend_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser frontend E2E
        working-directory: frontend
        env:
          MEDIZINHUB_FRONTEND_E2E_DATABASE_URL: postgresql+psycopg://medizinhub:medizinhub_ci@127.0.0.1:5432/medizinhub_frontend_e2e
          MEDIZINHUB_FRONTEND_E2E_API_URL: http://127.0.0.1:8091/api/v1
          MEDIZINHUB_FRONTEND_E2E_BASE_URL: http://127.0.0.1:3100
        run: |
          if [[ "${{ inputs.full_suite || false }}" == "true" ]]; then
            bash ../scripts/run_frontend_e2e.sh --project=chromium
            bash ../scripts/run_frontend_e2e.sh --project=firefox
            bash ../scripts/run_frontend_e2e.sh --project=webkit
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            npm run test:e2e:extended
            bash ../scripts/run_frontend_e2e.sh --project=firefox --grep @critical
            bash ../scripts/run_frontend_e2e.sh --project=webkit --grep @critical
          else
            npm run test:e2e:cross-browser
          fi

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-cross-browser-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14`
