name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate release version
        run: node scripts/version.mjs check

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_MEDIZINHUB_API_URL: http://localhost:8080/api/v1

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medizinhub_frontend_e2e
          POSTGRES_USER: medizinhub
          POSTGRES_PASSWORD: medizinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medizinhub -d medizinhub_frontend_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser workflows
        working-directory: frontend
        env:
          MEDIZINHUB_FRONTEND_E2E_DATABASE_URL: postgresql+psycopg://medizinhub:medizinhub_ci@127.0.0.1:5432/medizinhub_frontend_e2e
          MEDIZINHUB_FRONTEND_E2E_API_URL: http://127.0.0.1:8091/api/v1
          MEDIZINHUB_FRONTEND_E2E_BASE_URL: http://127.0.0.1:3100
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medizinhub_hms
          POSTGRES_USER: medizinhub
          POSTGRES_PASSWORD: medizinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medizinhub -d medizinhub_hms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend/app backend/tests backend/e2e backend/scripts

      - name: Check Alembic migrations on PostgreSQL
        working-directory: backend
        env:
          MEDIZINHUB_DATABASE_URL: postgresql+psycopg://medizinhub:medizinhub_ci@127.0.0.1:5432/medizinhub_hms
          # alembic/env.py imports `app.core.database`; unlike pytest (which
          # auto-adds backend/ to sys.path via tests/conftest.py), the plain
          # `alembic` console script needs PYTHONPATH set explicitly.
          PYTHONPATH: .
        run: alembic -c alembic/alembic.ini upgrade head

      - name: Test
        run: pytest backend/tests -q

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medizinhub_e2e
          POSTGRES_USER: medizinhub
          POSTGRES_PASSWORD: medizinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medizinhub -d medizinhub_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run live backend E2E workflows
        env:
          MEDIZINHUB_E2E_DATABASE_URL: postgresql+psycopg://medizinhub:medizinhub_ci@127.0.0.1:5432/medizinhub_e2e
          MEDIZINHUB_E2E_BASE_URL: http://127.0.0.1:8090/api/v1
          MEDIZINHUB_E2E_SUPER_ADMIN_EMAIL: super.admin@e2e.medizinhub.local
          MEDIZINHUB_E2E_SUPER_ADMIN_PASSWORD: SuperAdminE2EPass123
        run: bash backend/scripts/run_backend_e2e.sh

  docker:
    name: Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create CI env files
        run: |
          cp .env.example .env
          cp .env.staging.example .env.staging

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.local.yml config --quiet
          docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.yml build backend frontend
        env:
          NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: "false"

      - name: Build local development images
        run: |
          docker build -f backend/Dockerfile.dev backend
          docker build -f frontend/Dockerfile.dev frontend

  # Deploys to the EC2 dev/test box only after frontend, backend, and
  # docker checks all pass on develop. This runs as a job in this same
  # workflow (rather than a separate workflow triggered by `workflow_run`)
  # so it always executes the workflow definition from the branch that was
  # actually pushed — `workflow_run` instead reads the workflow file from
  # the repo's default branch, which caused a real deploy failure here when
  # this job's own fixes existed only on develop.
  deploy-dev:
    name: Deploy to Dev
    needs: [frontend, frontend-e2e, backend, backend-e2e, docker]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: dev-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          port: ${{ secrets.DEV_EC2_SSH_PORT }}
          script_stop: true
          script: |
            cd "${{ secrets.DEV_EC2_APP_DIR }}"

            # Reset any local changes on server
            git checkout -- .
            # Older EC2 checkouts may have this as an untracked local file.
            # Remove only this known collision so git pull can fast-forward.
            git clean -f -- frontend/Dockerfile

            # Pull latest code from develop
            git fetch origin
            git checkout develop
            git pull --ff-only origin develop

            # VERSION is the release identity used by the image and runtime.
            export MEDIZINHUB_APP_VERSION="$(tr -d '\r\n' < VERSION)"
            export MEDIZINHUB_BUILD_COMMIT="$(git rev-parse --short=12 HEAD)"
            export MEDIZINHUB_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # Check disk before deploy
            docker system df

            # Clean dangling images and stopped containers
            docker builder prune -af
            docker image prune -f
            docker container prune -f

            # Build and deploy using the staging compose file.
            # This is a public, testable EC2 site (devclinic.medizinhub.com),
            # not a personal dev machine, so it must run the same production
            # build as docker-compose.yml (Dockerfile, not Dockerfile.dev) —
            # only .env.staging differs (test DB, demo creds off). See
            # docker-compose.staging.yml / .env.staging.example.
            docker compose --env-file .env.staging -f docker-compose.staging.yml build --pull
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --remove-orphans

            # Check disk after deploy
            docker system df
            docker compose --env-file .env.staging -f docker-compose.staging.yml ps

            # Health checks (host port 8081 — 8080 is taken by another
            # project on this EC2 box; see docker-compose.staging.yml)
            for i in {1..30}; do
              if curl -f http://127.0.0.1:8081/health; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                docker compose --env-file .env.staging -f docker-compose.staging.yml logs backend --tail=200
                exit 1
              fi
              sleep 5
            done
            curl -f http://127.0.0.1:8081/api/v1/health
            python3 backend/scripts/verify_deployment.py \
              --api-origin http://127.0.0.1:8081 \
              --frontend-origin http://127.0.0.1:3001 \
              --expected-version "${MEDIZINHUB_APP_VERSION}" \
              --expected-commit "${MEDIZINHUB_BUILD_COMMIT}" \
              --expected-environment staging
            python3 backend/scripts/load_test_api.py \
              --base-url http://127.0.0.1:8081 \
              --path /api/v1/health \
              --requests 30 \
              --concurrency 5 \
              --max-p95-ms 1000 \
              --max-error-rate 0
