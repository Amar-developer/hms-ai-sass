name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_MEDIZINHUB_API_URL: http://localhost:8080/api/v1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medizinhub_hms
          POSTGRES_USER: medizinhub
          POSTGRES_PASSWORD: medizinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medizinhub -d medizinhub_hms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend/app backend/tests

      - name: Check Alembic migrations on PostgreSQL
        working-directory: backend
        env:
          MEDIZINHUB_DATABASE_URL: postgresql+psycopg://medizinhub:medizinhub_ci@127.0.0.1:5432/medizinhub_hms
          # alembic/env.py imports `app.core.database`; unlike pytest (which
          # auto-adds backend/ to sys.path via tests/conftest.py), the plain
          # `alembic` console script needs PYTHONPATH set explicitly.
          PYTHONPATH: .
        run: alembic -c alembic/alembic.ini upgrade head

      - name: Test
        run: pytest backend/tests -q

  docker:
    name: Docker Compose Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env files
        run: |
          cp .env.example .env
          cp .env.staging.example .env.staging

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.staging.yml config --quiet
