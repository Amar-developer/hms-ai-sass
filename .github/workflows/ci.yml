name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# Pushing again while a run is still going supersedes it. Cancelling is only
# safe for pull requests: a push to develop/main can reach the deploy job, and
# cancelling mid-deploy would leave the box half-updated. Those runs are left
# to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Remembers which suites already passed for the exact code they test.
  #
  # Each suite gets a key built from a content hash of the files that can
  # change its result. When a suite passes, it writes a tiny marker under that
  # key. On a later push, an unchanged suite produces the same key, the marker
  # is found, and the suite is skipped — so fixing one failing suite re-runs
  # only that suite instead of the whole pipeline.
  #
  # Two consequences worth knowing:
  #  - A flaky pass is remembered. Bump CACHE_VERSION below to invalidate every
  #    marker at once if you ever need a forced clean run.
  #  - Hashes cover this repository only. A suite whose result depends on
  #    something external (a newly published image, a registry outage) can be
  #    skipped while that external thing is broken.
  plan:
    name: Plan suites
    runs-on: ubuntu-latest
    env:
      CACHE_VERSION: v1
    outputs:
      frontend_key: ${{ steps.keys.outputs.frontend }}
      backend_key: ${{ steps.keys.outputs.backend }}
      backend_e2e_key: ${{ steps.keys.outputs.backend_e2e }}
      docker_key: ${{ steps.keys.outputs.docker }}
      frontend_done: ${{ steps.frontend.outputs.cache-hit }}
      backend_done: ${{ steps.backend.outputs.cache-hit }}
      backend_e2e_done: ${{ steps.backend_e2e.outputs.cache-hit }}
      docker_done: ${{ steps.docker.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A change to the workflow itself is part of every key: it can alter how
      # any suite runs, so it must retire every marker.
      - name: Build suite keys
        id: keys
        run: |
          set -euo pipefail
          ci='${{ hashFiles('.github/workflows/ci.yml') }}'
          fe='${{ hashFiles('frontend/**', 'scripts/**') }}'
          be='${{ hashFiles('backend/**') }}'
          img='${{ hashFiles('frontend/Dockerfile*', 'backend/Dockerfile*', 'docker-compose*.yml', '.env*.example') }}'
          v="${CACHE_VERSION}"
          {
            echo "frontend=pass-$v-frontend-$ci-$fe"
            echo "backend=pass-$v-backend-$ci-$be"
            echo "backend_e2e=pass-$v-backend-e2e-$ci-$be"
            echo "docker=pass-$v-docker-$ci-$fe-$be-$img"
          } >> "$GITHUB_OUTPUT"

      - name: Frontend already green?
        id: frontend
        uses: actions/cache/restore@v4
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.frontend }}
          lookup-only: true

      - name: Backend already green?
        id: backend
        uses: actions/cache/restore@v4
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.backend }}
          lookup-only: true

      - name: Backend E2E already green?
        id: backend_e2e
        uses: actions/cache/restore@v4
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.backend_e2e }}
          lookup-only: true

      - name: Docker already green?
        id: docker
        uses: actions/cache/restore@v4
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.docker }}
          lookup-only: true

      - name: Summary
        run: |
          echo "frontend      already green: ${{ steps.frontend.outputs.cache-hit == 'true' }}"
          echo "backend       already green: ${{ steps.backend.outputs.cache-hit == 'true' }}"
          echo "backend-e2e   already green: ${{ steps.backend_e2e.outputs.cache-hit == 'true' }}"
          echo "docker        already green: ${{ steps.docker.outputs.cache-hit == 'true' }}"

  frontend:
    name: Frontend
    needs: plan
    if: needs.plan.outputs.frontend_done != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate release version
        run: node scripts/version.mjs check

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_MEDIZINHUB_API_URL: http://localhost:8080/api/v1

      # Only reached when every step above succeeded, so the marker means
      # "this exact tree passed". A failing run writes nothing and the suite
      # runs again next push.
      - name: Mark suite green
        run: 'mkdir -p .ci-pass && date -u > .ci-pass/passed-at'
      - uses: actions/cache/save@v4
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.frontend_key }}

  frontend-e2e:
    name: Frontend E2E
    needs: plan
    runs-on: ubuntu-latest

    steps:
      - name: Browser E2E is manual only
        run: |
          echo "Frontend browser E2E is disabled for pull_request/push CI to reduce GitHub Actions minutes and avoid flaky browser quality gates."
          echo "Required frontend checks still run in the Frontend job: npm test, npm run typecheck, and npm run build."
          echo "Run the real Playwright suite manually from Actions → Frontend E2E Cross Browser when browser coverage is needed."

  backend:
    name: Backend
    needs: plan
    if: needs.plan.outputs.backend_done != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medizinhub_hms
          POSTGRES_USER: medizinhub
          POSTGRES_PASSWORD: medizinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medizinhub -d medizinhub_hms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend/app backend/tests backend/e2e backend/scripts

      - name: Check Alembic migrations on PostgreSQL
        working-directory: backend
        env:
          MEDIZINHUB_DATABASE_URL: postgresql+psycopg://medizinhub:medizinhub_ci@127.0.0.1:5432/medizinhub_hms
          # alembic/env.py imports `app.core.database`; unlike pytest (which
          # auto-adds backend/ to sys.path via tests/conftest.py), the plain
          # `alembic` console script needs PYTHONPATH set explicitly.
          PYTHONPATH: .
        run: alembic -c alembic/alembic.ini upgrade head

      - name: Test
        run: pytest backend/tests -q

      # Only reached when every step above succeeded, so the marker means
      # "this exact tree passed". A failing run writes nothing and the suite
      # runs again next push.
      - name: Mark suite green
        run: 'mkdir -p .ci-pass && date -u > .ci-pass/passed-at'
      - uses: actions/cache/save@v4
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.backend_key }}

  backend-e2e:
    name: Backend E2E
    needs: plan
    if: needs.plan.outputs.backend_e2e_done != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medizinhub_e2e
          POSTGRES_USER: medizinhub
          POSTGRES_PASSWORD: medizinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medizinhub -d medizinhub_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run live backend E2E workflows
        env:
          MEDIZINHUB_E2E_DATABASE_URL: postgresql+psycopg://medizinhub:medizinhub_ci@127.0.0.1:5432/medizinhub_e2e
          MEDIZINHUB_E2E_BASE_URL: http://127.0.0.1:8090/api/v1
          MEDIZINHUB_E2E_SUPER_ADMIN_EMAIL: super.admin@e2e.medizinhub.local
          MEDIZINHUB_E2E_SUPER_ADMIN_PASSWORD: SuperAdminE2EPass123
        run: bash backend/scripts/run_backend_e2e.sh

      # Only reached when every step above succeeded, so the marker means
      # "this exact tree passed". A failing run writes nothing and the suite
      # runs again next push.
      - name: Mark suite green
        run: 'mkdir -p .ci-pass && date -u > .ci-pass/passed-at'
      - uses: actions/cache/save@v4
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.backend_e2e_key }}

  docker:
    name: Docker Images
    needs: plan
    if: needs.plan.outputs.docker_done != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create CI env files
        run: |
          cp .env.example .env
          cp .env.staging.example .env.staging

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.local.yml config --quiet
          docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet

      # Compose config validation does not contact the registry. Pull the
      # externally hosted runtime image here so removed or mistyped tags fail
      # in CI before the deploy job reaches the EC2 host.
      - name: Verify external runtime images
        run: docker compose --env-file .env.staging.example -f docker-compose.staging.yml pull pgbouncer

      - name: Build production images
        run: docker compose -f docker-compose.yml build backend frontend

      - name: Build local development images
        run: |
          docker build -f backend/Dockerfile.dev backend
          docker build -f frontend/Dockerfile.dev frontend

      # Only reached when every step above succeeded, so the marker means
      # "this exact tree passed". A failing run writes nothing and the suite
      # runs again next push.
      - name: Mark suite green
        run: 'mkdir -p .ci-pass && date -u > .ci-pass/passed-at'
      - uses: actions/cache/save@v4
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.docker_key }}

  # Single always-running status for branch protection to require. A suite
  # that was already green reports "skipped", and a required check that never
  # reports leaves a PR permanently unmergeable — so protection points here
  # instead of at the individual suites. Skipped means "passed earlier for this
  # exact code"; only a real failure or cancellation fails the gate.
  gate:
    name: CI
    needs: [plan, frontend, frontend-e2e, backend, backend-e2e, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Results are read per suite rather than through `join(needs.*.result)`
      # so a failure names the suite responsible. The joined form printed six
      # bare words in dependency order ("success success failure ..."), which
      # meant opening jobs one by one to find the red one.
      - name: Check suite results
        env:
          PLAN: ${{ needs.plan.result }}
          FRONTEND: ${{ needs.frontend.result }}
          FRONTEND_E2E: ${{ needs['frontend-e2e'].result }}
          BACKEND: ${{ needs.backend.result }}
          BACKEND_E2E: ${{ needs['backend-e2e'].result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          failed=""
          for entry in "Plan suites|$PLAN" "Frontend|$FRONTEND" \
                       "Frontend E2E|$FRONTEND_E2E" "Backend|$BACKEND" \
                       "Backend E2E|$BACKEND_E2E" "Docker Images|$DOCKER"; do
            name="${entry%%|*}"
            result="${entry##*|}"
            case "$result" in
              success) echo "  PASS     $name" ;;
              skipped) echo "  SKIPPED  $name (already green for this code)" ;;
              *)       echo "  FAILED   $name ($result)"; failed="$failed $name" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo
            echo "CI failed. Suite(s) needing attention:$failed"
            exit 1
          fi
          echo
          echo "All suites that ran passed."

  deploy-dev:
    name: Deploy to Dev
    # Cached suites are intentionally skipped. Because skipped jobs propagate
    # through a dependency chain, override the implicit success() check and
    # rely explicitly on the gate's result. The gate has already verified
    # that every suite either passed now or was cached as green.
    needs: gate
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      github.ref == 'refs/heads/develop' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: dev-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          port: ${{ secrets.DEV_EC2_SSH_PORT }}
          script_stop: true
          script: |
            cd "${{ secrets.DEV_EC2_APP_DIR }}"

            # Reset any local changes on server
            git checkout -- .
            # Older EC2 checkouts may have this as an untracked local file.
            # Remove only this known collision so git pull can fast-forward.
            git clean -f -- frontend/Dockerfile

            # Pull latest code from develop
            git fetch origin
            git checkout develop
            git pull --ff-only origin develop

            # VERSION is the release identity used by the image and runtime.
            export MEDIZINHUB_APP_VERSION="$(tr -d '\r\n' < VERSION)"
            export MEDIZINHUB_BUILD_COMMIT="$(git rev-parse --short=12 HEAD)"
            export MEDIZINHUB_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # Check disk before deploy
            docker system df

            # Clean dangling images and stopped containers
            docker builder prune -af
            docker image prune -f
            docker container prune -f

            # Build and deploy using the staging compose file.
            # This is a public, testable EC2 site (devclinic.medizinhub.com),
            # not a personal dev machine, so it must run the same production
            # build as docker-compose.yml (Dockerfile, not Dockerfile.dev) —
            # only .env.staging differs (test DB, demo creds off). See
            # docker-compose.staging.yml / .env.staging.example.
            docker compose --env-file .env.staging -f docker-compose.staging.yml build --pull
            if ! docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --remove-orphans --wait --wait-timeout 180; then
              docker compose --env-file .env.staging -f docker-compose.staging.yml ps
              docker compose --env-file .env.staging -f docker-compose.staging.yml logs postgres pgbouncer backend --tail=200
              exit 1
            fi

            # Check disk after deploy
            docker system df
            docker compose --env-file .env.staging -f docker-compose.staging.yml ps

            # Health checks (host port 8081 — 8080 is taken by another
            # project on this EC2 box; see docker-compose.staging.yml)
            for i in {1..30}; do
              if curl -f http://127.0.0.1:8081/health; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                docker compose --env-file .env.staging -f docker-compose.staging.yml logs backend --tail=200
                exit 1
              fi
              sleep 5
            done
            curl -f http://127.0.0.1:8081/api/v1/health
            python3 backend/scripts/verify_deployment.py \
              --api-origin http://127.0.0.1:8081 \
              --frontend-origin http://127.0.0.1:3001 \
              --expected-version "${MEDIZINHUB_APP_VERSION}" \
              --expected-commit "${MEDIZINHUB_BUILD_COMMIT}" \
              --expected-environment staging
            python3 backend/scripts/load_test_api.py \
              --base-url http://127.0.0.1:8081 \
              --path /api/v1/health \
              --requests 30 \
              --concurrency 5 \
              --max-p95-ms 1000 \
              --max-error-rate 0

  deploy-production:
    name: Deploy to Production
    # Use the same explicit gate check as deploy-dev so cached/skipped suites
    # cannot suppress a valid production deployment either.
    needs: gate
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    uses: ./.github/workflows/deploy-ec2.yml
    secrets: inherit
