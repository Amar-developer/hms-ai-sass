name: Deploy to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"

            # Reset any local changes on server before pulling
            git checkout -- .
            # Older EC2 checkouts may have this as an untracked local file.
            # Remove only this known collision so git pull can fast-forward.
            git clean -f -- frontend/Dockerfile

            # Pull latest code from main
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            # Check disk before deploy
            docker system df

            # Clean dangling images and stopped containers
            docker builder prune -af
            docker image prune -f
            docker container prune -f

            # Build and deploy using production compose
            docker compose -f docker-compose.yml build --pull
            docker compose -f docker-compose.yml up -d --remove-orphans

            # Check disk after deploy
            docker system df
            docker compose -f docker-compose.yml ps

            # Wait for backend to start
            sleep 15

            # Health checks
            curl -f http://127.0.0.1:8080/health
            curl -f http://127.0.0.1:8080/api/v1/health
