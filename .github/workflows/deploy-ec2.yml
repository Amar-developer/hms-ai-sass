name: Deploy to Production

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          MEDIZINHUB_BACKUP_PASSPHRASE: ${{ secrets.PRODUCTION_BACKUP_PASSPHRASE }}
          MEDIZINHUB_BACKUP_DIR: ${{ secrets.PRODUCTION_BACKUP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          envs: MEDIZINHUB_BACKUP_PASSPHRASE,MEDIZINHUB_BACKUP_DIR
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"

            # Reset any local changes on server before pulling
            git checkout -- .
            # Older EC2 checkouts may have this as an untracked local file.
            # Remove only this known collision so git pull can fast-forward.
            git clean -f -- frontend/Dockerfile

            # Pull latest code from main
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            # VERSION is the release identity used by the image and runtime.
            export MEDIZINHUB_APP_VERSION="$(tr -d '\r\n' < VERSION)"
            export MEDIZINHUB_BUILD_COMMIT="$(git rev-parse --short=12 HEAD)"
            export MEDIZINHUB_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # Every production release starts with an encrypted, verified
            # database recovery point outside the application checkout.
            if [ -z "${MEDIZINHUB_BACKUP_DIR:-}" ]; then
              echo "PRODUCTION_BACKUP_DIR is required"
              exit 1
            fi
            bash scripts/backup_postgres.sh \
              --compose-file docker-compose.yml \
              --env-file .env \
              --output-dir "${MEDIZINHUB_BACKUP_DIR}" \
              --application-commit "${PREVIOUS_COMMIT}"

            # Check disk before deploy
            docker system df

            # Clean dangling images and stopped containers
            docker builder prune -af
            docker image prune -f
            docker container prune -f

            # Build and deploy using production compose
            docker compose -f docker-compose.yml build --pull
            docker compose -f docker-compose.yml run --rm --no-deps backend \
              python scripts/verify_production_environment.py
            if ! docker compose -f docker-compose.yml up -d --remove-orphans --wait --wait-timeout 180; then
              docker compose -f docker-compose.yml ps
              docker compose -f docker-compose.yml logs postgres pgbouncer backend --tail=200
              exit 1
            fi

            # Check disk after deploy
            docker system df
            docker compose -f docker-compose.yml ps

            # Health checks
            for i in {1..30}; do
              if curl -f http://127.0.0.1:8080/health; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                docker compose -f docker-compose.yml logs backend --tail=200
                exit 1
              fi
              sleep 5
            done
            curl -f http://127.0.0.1:8080/api/v1/health
            curl -f http://127.0.0.1:8080/api/v1/readiness
            python3 backend/scripts/verify_deployment.py \
              --api-origin http://127.0.0.1:8080 \
              --frontend-origin http://127.0.0.1:3000 \
              --expected-version "${MEDIZINHUB_APP_VERSION}" \
              --expected-commit "${MEDIZINHUB_BUILD_COMMIT}" \
              --expected-environment production
