name: Deploy to Dev (manual)

# Automatic post-CI deploys happen inside ci.yml's deploy-dev job, not here —
# see the comment on that job for why. This workflow is kept only for
# on-demand re-deploys, e.g. re-running a deploy without a new push.
# workflow_dispatch always uses the workflow file from the branch you select
# when dispatching, so it isn't affected by the default-branch mismatch that
# broke the old workflow_run-based version of this file.
on:
  workflow_dispatch:

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          port: ${{ secrets.DEV_EC2_SSH_PORT }}
          script_stop: true
          script: |
            cd "${{ secrets.DEV_EC2_APP_DIR }}"

            # Reset any local changes on server
            git checkout -- .
            # Older EC2 checkouts may have this as an untracked local file.
            # Remove only this known collision so git pull can fast-forward.
            git clean -f -- frontend/Dockerfile

            # Pull latest code from develop
            git fetch origin
            git checkout develop
            git pull --ff-only origin develop

            # Check disk before deploy
            docker system df

            # Clean dangling images and stopped containers
            docker builder prune -af
            docker image prune -f
            docker container prune -f

            # Build and deploy using the staging compose file.
            # This is a public, testable EC2 site (devclinic.medizinhub.com),
            # not a personal dev machine, so it must run the same production
            # build as docker-compose.yml (Dockerfile, not Dockerfile.dev) —
            # only .env.staging differs (test DB, demo creds off). See
            # docker-compose.staging.yml / .env.staging.example.
            docker compose -f docker-compose.staging.yml build --pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            # Check disk after deploy
            docker system df
            docker compose -f docker-compose.staging.yml ps

            # Health checks (host port 8081 — 8080 is taken by another
            # project on this EC2 box; see docker-compose.staging.yml)
            for i in {1..30}; do
              if curl -f http://127.0.0.1:8081/health; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                docker compose -f docker-compose.staging.yml logs backend --tail=200
                exit 1
              fi
              sleep 5
            done
            curl -f http://127.0.0.1:8081/api/v1/health
